<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        .excel-cell {
            min-width: 120px;
            padding: 8px;
            border: 1px solid #e2e8f0;
            text-align: left;
        }
        .excel-header {
            background-color: #f7fafc;
            font-weight: bold;
        }
        .excel-row:hover {
            background-color: #f8fafc;
        }
        .action-btn {
            transition: all 0.2s ease;
        }
        .action-btn:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body class="bg-gray-50">
    <!-- Home Page -->
    <div id="home-page" class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="bg-white rounded-xl shadow-lg p-8 max-w-md w-full">
            <h1 class="text-3xl font-bold text-center text-indigo-600 mb-6">Employee Management System</h1>
            <p class="text-gray-600 mb-8 text-center">Manage your employee data with an Excel-like interface right in your browser.</p>
            <button id="view-employees-btn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition duration-200 transform hover:scale-105">
                List of Employees
            </button>
        </div>
    </div>

    <!-- Employee List Page -->
    <div id="employee-list-page" class="min-h-screen p-6 hidden">
        <div class="max-w-6xl mx-auto">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-2xl font-bold text-indigo-600">Employee Records</h1>
                <div class="flex space-x-2">
                    <button id="back-to-home" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition">
                        Back to Home
                    </button>
                    <button id="add-employee-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-2 px-4 rounded-lg transition">
                        Add Employee
                    </button>
                    <button id="download-excel" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded-lg transition">
                        Download Excel
                    </button>
                    <button id="upload-excel" class="bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded-lg transition">
                        Upload Excel
                    </button>
                    <input type="file" id="excel-upload-input" class="hidden" accept=".xlsx, .xls" />
                </div>
            </div>

            <div class="bg-white rounded-xl shadow-md overflow-hidden mb-6">
                <div class="overflow-x-auto">
                    <table id="employee-table" class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="excel-cell excel-header px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="excel-cell excel-header px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                <th class="excel-cell excel-header px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Position</th>
                                <th class="excel-cell excel-header px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Department</th>
                                <th class="excel-cell excel-header px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Salary</th>
                                <th class="excel-cell excel-header px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Hire Date</th>
                                <th class="excel-cell excel-header px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="employee-table-body" class="bg-white divide-y divide-gray-200">
                            <!-- Employee data will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Add/Edit Employee Modal -->
    <div id="employee-modal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50">
        <div class="bg-white rounded-xl shadow-xl p-6 w-full max-w-md">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modal-title" class="text-xl font-bold text-indigo-600">Add New Employee</h2>
                <button id="close-modal" class="text-gray-500 hover:text-gray-700">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>
            <form id="employee-form" class="space-y-4">
                <input type="hidden" id="employee-id">
                <div>
                    <label for="name" class="block text-sm font-medium text-gray-700">Full Name</label>
                    <input type="text" id="name" name="name" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="position" class="block text-sm font-medium text-gray-700">Position</label>
                    <input type="text" id="position" name="position" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="department" class="block text-sm font-medium text-gray-700">Department</label>
                    <select id="department" name="department" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                        <option value="HR">Human Resources</option>
                        <option value="IT">Information Technology</option>
                        <option value="Finance">Finance</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Operations">Operations</option>
                    </select>
                </div>
                <div>
                    <label for="salary" class="block text-sm font-medium text-gray-700">Salary</label>
                    <input type="number" id="salary" name="salary" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div>
                    <label for="hire-date" class="block text-sm font-medium text-gray-700">Hire Date</label>
                    <input type="date" id="hire-date" name="hire-date" class="mt-1 block w-full border border-gray-300 rounded-md shadow-sm py-2 px-3 focus:outline-none focus:ring-indigo-500 focus:border-indigo-500">
                </div>
                <div class="flex justify-end space-x-3 pt-4">
                    <button type="button" id="cancel-employee" class="bg-gray-200 hover:bg-gray-300 text-gray-800 font-bold py-2 px-4 rounded-lg transition">
                        Cancel
                    </button>
                    <button type="submit" id="save-employee" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 px-4 rounded-lg transition">
                        Save
                    </button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Sample employee data (in a real app, this would come from a database)
        let employees = [
            { id: 1, name: "John Doe", position: "Software Engineer", department: "IT", salary: 85000, hireDate: "2020-05-15" },
            { id: 2, name: "Jane Smith", position: "HR Manager", department: "HR", salary: 75000, hireDate: "2019-03-10" },
            { id: 3, name: "Mike Johnson", position: "Financial Analyst", department: "Finance", salary: 68000, hireDate: "2021-01-22" },
            { id: 4, name: "Sarah Williams", position: "Marketing Specialist", department: "Marketing", salary: 62000, hireDate: "2020-11-05" },
            { id: 5, name: "David Brown", position: "Operations Manager", department: "Operations", salary: 78000, hireDate: "2018-07-30" }
        ];

        // DOM Elements
        const homePage = document.getElementById('home-page');
        const employeeListPage = document.getElementById('employee-list-page');
        const viewEmployeesBtn = document.getElementById('view-employees-btn');
        const backToHomeBtn = document.getElementById('back-to-home');
        const employeeTableBody = document.getElementById('employee-table-body');
        const addEmployeeBtn = document.getElementById('add-employee-btn');
        const employeeModal = document.getElementById('employee-modal');
        const closeModalBtn = document.getElementById('close-modal');
        const cancelEmployeeBtn = document.getElementById('cancel-employee');
        const employeeForm = document.getElementById('employee-form');
        const modalTitle = document.getElementById('modal-title');
        const downloadExcelBtn = document.getElementById('download-excel');
        const uploadExcelBtn = document.getElementById('upload-excel');
        const excelUploadInput = document.getElementById('excel-upload-input');

        // Current employee being edited
        let currentEmployeeId = null;

        // Event Listeners
        viewEmployeesBtn.addEventListener('click', showEmployeeList);
        backToHomeBtn.addEventListener('click', showHomePage);
        addEmployeeBtn.addEventListener('click', () => showEmployeeForm());
        closeModalBtn.addEventListener('click', closeEmployeeForm);
        cancelEmployeeBtn.addEventListener('click', closeEmployeeForm);
        employeeForm.addEventListener('submit', saveEmployee);
        downloadExcelBtn.addEventListener('click', exportToExcel);
        uploadExcelBtn.addEventListener('click', () => excelUploadInput.click());
        excelUploadInput.addEventListener('change', importFromExcel);

        // Initialize the app
        function init() {
            renderEmployeeTable();
        }

        // Show employee list page
        function showEmployeeList() {
            homePage.classList.add('hidden');
            employeeListPage.classList.remove('hidden');
        }

        // Show home page
        function showHomePage() {
            employeeListPage.classList.add('hidden');
            homePage.classList.remove('hidden');
        }

        // Render employee table
        function renderEmployeeTable() {
            employeeTableBody.innerHTML = '';
            
            employees.forEach(employee => {
                const row = document.createElement('tr');
                row.className = 'excel-row';
                row.innerHTML = `
                    <td class="excel-cell px-6 py-4 whitespace-nowrap">${employee.id}</td>
                    <td class="excel-cell px-6 py-4 whitespace-nowrap">${employee.name}</td>
                    <td class="excel-cell px-6 py-4 whitespace-nowrap">${employee.position}</td>
                    <td class="excel-cell px-6 py-4 whitespace-nowrap">${employee.department}</td>
                    <td class="excel-cell px-6 py-4 whitespace-nowrap">$${employee.salary.toLocaleString()}</td>
                    <td class="excel-cell px-6 py-4 whitespace-nowrap">${formatDate(employee.hireDate)}</td>
                    <td class="excel-cell px-6 py-4 whitespace-nowrap">
                        <div class="flex space-x-2">
                            <button data-id="${employee.id}" class="edit-btn action-btn bg-blue-500 hover:bg-blue-600 text-white text-xs font-bold py-1 px-2 rounded">
                                Edit
                            </button>
                            <button data-id="${employee.id}" class="delete-btn action-btn bg-red-500 hover:bg-red-600 text-white text-xs font-bold py-1 px-2 rounded">
                                Delete
                            </button>
                        </div>
                    </td>
                `;
                employeeTableBody.appendChild(row);
            });

            // Add event listeners to edit and delete buttons
            document.querySelectorAll('.edit-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    editEmployee(id);
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    const id = parseInt(e.target.getAttribute('data-id'));
                    deleteEmployee(id);
                });
            });
        }

        // Format date for display
        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric' };
            return new Date(dateString).toLocaleDateString('en-US', options);
        }

        // Show employee form (for add or edit)
        function showEmployeeForm(employee = null) {
            if (employee) {
                modalTitle.textContent = 'Edit Employee';
                currentEmployeeId = employee.id;
                document.getElementById('employee-id').value = employee.id;
                document.getElementById('name').value = employee.name;
                document.getElementById('position').value = employee.position;
                document.getElementById('department').value = employee.department;
                document.getElementById('salary').value = employee.salary;
                document.getElementById('hire-date').value = employee.hireDate;
            } else {
                modalTitle.textContent = 'Add New Employee';
                currentEmployeeId = null;
                employeeForm.reset();
                document.getElementById('employee-id').value = '';
                document.getElementById('hire-date').value = new Date().toISOString().split('T')[0];
            }
            employeeModal.classList.remove('hidden');
        }

        // Close employee form
        function closeEmployeeForm() {
            employeeModal.classList.add('hidden');
        }

        // Save employee (add or update)
        function saveEmployee(e) {
            e.preventDefault();
            
            const id = currentEmployeeId || employees.length > 0 ? Math.max(...employees.map(e => e.id)) + 1 : 1;
            const name = document.getElementById('name').value;
            const position = document.getElementById('position').value;
            const department = document.getElementById('department').value;
            const salary = parseFloat(document.getElementById('salary').value);
            const hireDate = document.getElementById('hire-date').value;
            
            const employee = { id, name, position, department, salary, hireDate };
            
            if (currentEmployeeId) {
                // Update existing employee
                const index = employees.findIndex(e => e.id === currentEmployeeId);
                if (index !== -1) {
                    employees[index] = employee;
                }
            } else {
                // Add new employee
                employees.push(employee);
            }
            
            renderEmployeeTable();
            closeEmployeeForm();
        }

        // Edit employee
        function editEmployee(id) {
            const employee = employees.find(e => e.id === id);
            if (employee) {
                showEmployeeForm(employee);
            }
        }

        // Delete employee
        function deleteEmployee(id) {
            if (confirm('Are you sure you want to delete this employee?')) {
                employees = employees.filter(e => e.id !== id);
                renderEmployeeTable();
            }
        }

        // Export to Excel
        function exportToExcel() {
            // Prepare data for export
            const exportData = employees.map(emp => ({
                ID: emp.id,
                Name: emp.name,
                Position: emp.position,
                Department: emp.department,
                Salary: emp.salary,
                'Hire Date': emp.hireDate
            }));

            // Create workbook
            const wb = XLSX.utils.book_new();
            const ws = XLSX.utils.json_to_sheet(exportData);
            XLSX.utils.book_append_sheet(wb, ws, "Employees");

            // Generate file and download
            XLSX.writeFile(wb, "employee_data.xlsx");
        }

        // Import from Excel
        function importFromExcel(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                
                // Get first worksheet
                const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(worksheet);
                
                // Process imported data
                employees = jsonData.map(item => ({
                    id: item.ID || item.id || Math.floor(Math.random() * 100000),
                    name: item.Name || item.name || '',
                    position: item.Position || item.position || '',
                    department: item.Department || item.department || '',
                    salary: item.Salary || item.salary || 0,
                    hireDate: item['Hire Date'] || item.hireDate || new Date().toISOString().split('T')[0]
                }));
                
                renderEmployeeTable();
                excelUploadInput.value = ''; // Reset file input
            };
            reader.readAsArrayBuffer(file);
        }

        // Initialize the app
        init();
    </script>
</body>
</html>
